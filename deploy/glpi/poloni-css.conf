# Poloni ITSM - CSS homologados
# Nao expor os diretorios privados dos plugins.

AliasMatch "^/plugins/poloniitsm/css/(poloni-3d-v05|consultation-grid-poloni-v2|forms-poloni-3d|login-poloni)\.css$" "/var/www/glpi/plugins/poloniitsm/public/css/$1.css"

<Directory "/var/www/glpi/plugins/poloniitsm/public/css">
    Options -Indexes -ExecCGI -Includes -MultiViews
    AllowOverride None
    Require all granted
</Directory>

# Logo Poloni do login
# Substitui somente o recurso publico solicitado pelo GLPI.
AliasMatch "^/pics/logos/logo-GLPI-250-black\.png$" "/var/www/glpi/plugins/poloniitsm/public/css/logo-poloni-login.png"
